name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests app

      - name: Build snapshot
        run: atlashire build --as-of 2026-09-13

      - name: Validate recommendation benchmark
        run: atlashire validate --as-of 2026-09-13

      - name: Test
        run: pytest -q

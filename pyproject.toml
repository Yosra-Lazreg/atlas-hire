[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlashire"
version = "0.1.0"
description = "Explainable opportunity intelligence for Algerian data students"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2,<3",
    "plotly>=5.24,<7",
    "PyYAML>=6.0,<7",
    "requests>=2.32,<3",
    "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
atlashire = "opportunity_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
